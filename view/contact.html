<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bazaar</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #fbeedc 0%, #f8e6b5 100%);
            min-height: 100vh;
            margin: 0;
        }
        .contact-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            margin-bottom: 60px;
        }
        .contact-card {
            background: #fffefb;
            border-radius: 18px;
            box-shadow: 0 4px 24px #cdb89233;
            padding: 36px 40px 30px 40px;
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            border: 1px solid #f2e2be;
        }
        .contact-section h2 {
            font-size: 2.1rem;
            margin-bottom: 24px;
            font-weight: 700;
            color: #6a4a1b;
            letter-spacing: 0.5px;
        }
        .contact-form label {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            font-weight: 600;
            color: #5b4a2b;
        }
        .contact-form input,
        .contact-form textarea {
            flex: 1;
            margin-left: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            border: 1px solid #e2cfa2;
            background: #fff8e6;
            font-size: 1rem;
            font-family: inherit;
            transition: border 0.2s;
        }
        .contact-form input:focus,
        .contact-form textarea:focus {
            border: 1.5px solid #c19a6b;
            outline: none;
            background: #fffbe7;
        }
        .contact-form textarea {
            min-height: 70px;
            resize: vertical;
        }
        .input-icon {
            display: flex;
            align-items: center;
            margin-right: 6px;
        }
        .cta-btn {
            background: #f2c66d;
            color: #fff;
            border: none;
            border-radius: 7px;
            padding: 11px 0;
            width: 100%;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 2px 8px #e9c97a33;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .cta-btn:hover, .cta-btn:focus {
            background: #e2b04a;
            box-shadow: 0 4px 16px #e9c97a55;
        }
        .contact-success {
            color: #2a7a2a;
            margin-top: 14px;
            font-weight: 600;
            min-height: 22px;
        }
        @media (max-width: 600px) {
            .contact-card {
                padding: 18px 6vw 16px 6vw;
                max-width: 98vw;
            }
            .contact-section {
                margin-top: 20px;
            }
            .contact-section h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

                    <a href="setting.html"><svg width="20" height="20" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="#6a4a1b" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06A1.65 1.65 0 0015 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 008.6 15a1.65 1.65 0 00-1.82-.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.6c.29-.12.61-.19.94-.19s.65.07.94.19a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0015.4 9c.12.29.19.61.19.94s-.07.65-.19.94z" stroke="#6a4a1b" stroke-width="2"/></svg> Settings</a>

    <main>
        <section class="contact-section">
            <h2>Contact Us</h2>
            <div class="contact-card">
            <form class="contact-form" id="contactForm">
                <label><span class="input-icon" style="display:flex;align-items:center;justify-content:center;margin-right:6px;"><svg fill="none" height="20" width="20" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="#c19a6b" stroke-width="2"/><path d="M4 20c0-3.3137 3.134-6 7-6s7 2.6863 7 6" stroke="#c19a6b" stroke-width="2" stroke-linecap="round"/></svg></span>Name<input type="text" required></label>
                <label><span class="input-icon" style="display:flex;align-items:center;justify-content:center;margin-right:6px;"><svg fill="none" height="20" width="20" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" stroke="#c19a6b" stroke-width="2"/><path d="m6 8 6 5 6-5" stroke="#c19a6b" stroke-width="2"/></svg></span>Email<input type="email" required></label>
                <label><span class="input-icon"><img src="uploads/message.svg" height="20" alt="Message icon"></span>Message<textarea required></textarea></label>
                <button type="submit" class="cta-btn">Send Message</button>
                <div id="contactSuccess" class="contact-success"></div>
            </form>
            </div>
        </section>
        <script>
        document.getElementById('contactForm').onsubmit = function(e) {
            e.preventDefault();
            document.getElementById('contactSuccess').textContent = 'Thank you! Your message has been sent.';
            this.reset();
        };
        </script>
