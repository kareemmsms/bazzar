<!DOCTYPE html>

  <style>
    body {
      background: linear-gradient(120deg, #fff9ed 0%, #fbeedc 100%);

      flex-direction: column;

      align-items: center;
    }
    .error-section {
      background: #fffefb;
      border-radius: 26px;
      box-shadow: 0 8px 32px #e5737333, 0 0 0 8px #fff;
      max-width: 480px;
      margin: 60px auto 0 auto;
      padding: 48px 38px 36px 38px;
      border: 1.5px solid #fff0f0;
      position: relative;
      text-align: center;
    }
    .error-icon {
      color: #e57373;
      font-size: 3.5rem;
      margin-bottom: 16px;
      animation: shake 0.7s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-8px); }
      40%, 60% { transform: translateX(8px); }
    }
    .error-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #b94a48;
      margin-bottom: 14px;
    }
    .error-desc {
      color: #7c6845;
      font-size: 1.13rem;
      margin-bottom: 30px;
    }
    .error-btn {
      background: linear-gradient(90deg, #e57373 60%, #b94a48 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 30px;
      font-size: 1.07rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px #e5737333;
      transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
      text-decoration: none;
      display: inline-block;
      margin: 0 10px;
    }
    .error-btn:hover, .error-btn:focus {
      background: #b94a48;
      box-shadow: 0 4px 16px #e5737355;
      transform: translateY(-2px) scale(1.03);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="error-section">
