    <style>
      /* Modern switch style for checkboxes */
      .switch {
        position: relative;
        display: inline-block;
        width: 46px;
        height: 24px;
        margin-right: 12px;
        vertical-align: middle;
      }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #e2b04a;
        border-radius: 24px;
        transition: .3s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 18px; width: 18px;
        left: 3px; bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: .3s;
        box-shadow: 0 2px 6px #cdb89233;
      }
      input:checked + .slider {
        background: #f2c66d;
      }
      input:checked + .slider:before {
        transform: translateX(22px);
      }
      .switch-label {
        font-size: 1.08rem;
        color: #7c6845;
        font-weight: 500;
        margin-bottom: 0;
        vertical-align: middle;
      }
      .setting-section label { display: flex; align-items: center; margin-bottom: 16px; }
      .setting-section h3 { margin-bottom: 16px; color: #c19a6b; font-weight: 700; }
      @media (max-width: 600px) {
        .settings-container { padding: 8vw 1vw 6vw 1vw; }
        .setting-section { padding: 12px 2vw 10px 2vw !important; }
      }
    </style>
    <script>
      // Override tab content for Notification and Permission to use switches
      function showTab(tab) {
        document.querySelectorAll('.settings-tabs button').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tabNotif').classList.toggle('active', tab==='notif');
        document.getElementById('tabPerm').classList.toggle('active', tab==='perm');
        document.getElementById('tabRate').classList.toggle('active', tab==='rate');
        document.getElementById('tabLegal').classList.toggle('active', tab==='legal');
        const content = document.getElementById('tabContent');
        if(tab==='notif') {
          content.innerHTML = `<h3><i class='fa-solid fa-bell me-2'></i>Notification Settings</h3>
            <label><span class='switch'><input type='checkbox' checked><span class='slider'></span></span><span class='switch-label'>Email Notifications</span></label>
            <label><span class='switch'><input type='checkbox'><span class='slider'></span></span><span class='switch-label'>SMS Notifications</span></label>
            <label><span class='switch'><input type='checkbox'><span class='slider'></span></span><span class='switch-label'>Push Notifications</span></label>`;
        } else if(tab==='perm') {
          content.innerHTML = `<h3><i class='fa-solid fa-user-shield me-2'></i>Permissions</h3>
            <label><span class='switch'><input type='checkbox' checked><span class='slider'></span></span><span class='switch-label'>Allow Product Management</span></label>
            <label><span class='switch'><input type='checkbox'><span class='slider'></span></span><span class='switch-label'>Allow Sales Tracking</span></label>
            <label><span class='switch'><input type='checkbox'><span class='slider'></span></span><span class='switch-label'>Allow Support Contact</span></label>`;
        } else if(tab==='rate') {
          content.innerHTML = `<h3><i class='fa-solid fa-star me-2'></i>Rate Our App</h3>
            <span id='starRating'>
              <span class='star' onclick='setRating(1)'>&#9733;</span>
              <span class='star' onclick='setRating(2)'>&#9733;</span>
              <span class='star' onclick='setRating(3)'>&#9733;</span>
              <span class='star' onclick='setRating(4)'>&#9733;</span>
              <span class='star' onclick='setRating(5)'>&#9733;</span>
            </span>
            <span id='rateMsg'></span>`;
        } else if(tab==='legal') {
          content.innerHTML = `<h3><i class='fa-solid fa-scale-balanced me-2'></i>Legal/About</h3>
            <p>This is a demo Bazaar E-commerce platform. All rights reserved. &copy; 2025</p>
            <p><b>About:</b> Bazaar is a modern e-commerce solution for consignors and sellers.</p>`;
        }
      }
      function setRating(r) {
        document.querySelectorAll('.star').forEach((star, idx) => {
          star.classList.toggle('selected', idx < r);
        });
        document.getElementById('rateMsg').textContent = `Thank you for rating us ${r} star${r>1?'s':''}!`;
      }
      // Show default tab
      showTab('notif');
    </script>
