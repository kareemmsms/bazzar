<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Sent | Bazaar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(120deg, #fff9ed 0%, #fbeedc 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .success-card {
            background: #fffefb;
            border-radius: 22px;
            box-shadow: 0 8px 32px #e9c97a33, 0 0 0 8px #fff;
            padding: 42px 44px 36px 44px;
            max-width: 420px;
            width: 100%;
            margin: 60px auto 0 auto;
            border: 1.5px solid #fff;
            z-index: 2;
            position: relative;
            text-align: center;
        }
        .success-icon {
            color: #2ecc71;
            background: #eafbe8;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 62px;
            font-size: 2.5rem;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px #e2cfa233;
            animation: popIn 1s cubic-bezier(.47,1.64,.41,.8);
        }
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-title {
            font-size: 2rem;
            font-weight: 900;
            color: #c19a6b;
            margin-bottom: 12px;
        }
        .success-desc {
            color: #8e7a5a;
            font-size: 1.13rem;
            margin-bottom: 30px;
        }
        .back-btn {
            background: linear-gradient(90deg, #f2c66d 60%, #e2b04a 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.07rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px #e9c97a33;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover, .back-btn:focus {
            background: #e2b04a;
            box-shadow: 0 4px 16px #e9c97a55;
            transform: translateY(-2px) scale(1.03);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon mb-3">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="success-title">Thank You!</div>
        <div class="success-desc">Your feedback has been sent successfully.<br>We appreciate your input and will get back to you soon if needed.</div>
        <a href="contact.php" class="back-btn"><i class="fa-solid fa-arrow-left me-2"></i>Back to Contact</a>
    </div>
</body>
</html>
